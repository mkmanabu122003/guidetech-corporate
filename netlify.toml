# Netlify configuration for Guide Tech Corporate Website

[build]
  # Directory to publish (root since we have a simple static site)
  publish = "."

# Headers for better security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Netlify publishes the repo root, so working files would otherwise be
# publicly fetchable. Keep build scripts, planning docs, and internal design
# drafts in the repo but out of the public site.
[[redirects]]
  from = "/scripts/*"
  to = "/japan-partner/en/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/image-src/*"
  to = "/japan-partner/en/404.html"
